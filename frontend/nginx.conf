# Serves the built PWA and proxies /api to the backend container.
#
# Client-IP chain: browser -> Cloudflare edge -> cloudflared -> nginx -> api.
# Cloudflare puts the visitor's IP in CF-Connecting-IP; nginx forwards it as
# the X-Forwarded-For value the API rate-limiter keys on (TRUST_PROXY=1 makes
# the API take the last entry). Without Cloudflare in front (LAN access),
# fall back to the direct peer address.
map $http_cf_connecting_ip $client_real_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    # hashed build assets are immutable; cache hard
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # the service worker and app shell must revalidate on every load
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # SPA fallback so /join/{code} deep links load the app
    location / {
        try_files $uri /index.html;
    }
}
