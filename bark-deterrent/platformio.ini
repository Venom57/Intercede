; Bark detector + ultrasonic deterrent for the Lonely Binary ESP32-S3 (N16R8).
;
;   pio run -t upload        build + flash
;   pio device monitor       serial console (type `help`)
;
; Plug into the board's UART port (the one through the USB-serial chip,
; usually labelled COM or UART). To use the native USB port instead, uncomment
; the ARDUINO_USB_CDC_ON_BOOT line below.

[platformio]
default_envs = lonelybinary_s3

[env:lonelybinary_s3]
; pioarduino: community PlatformIO platform for Arduino-ESP32 core 3.x (ESP-IDF 5.5).
; The official platformio/espressif32 platform is stuck on core 2.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino

monitor_speed = 921600
upload_speed = 921600
monitor_filters = esp32_exception_decoder

build_flags =
    -D CORE_DEBUG_LEVEL=1
;   -D ARDUINO_USB_CDC_ON_BOOT=1     ; serial console on the native USB port
;   -D BARK_FORCE_PLACEHOLDER        ; ignore an Edge Impulse model in lib/
