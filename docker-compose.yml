services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: intercede
      POSTGRES_USER: intercede
      POSTGRES_PASSWORD: change-me
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://intercede:change-me@db/intercede
      SECRET_KEY: change-me-long-random
      COOKIE_SECURE: "1"
      PUBLIC_BASE_URL: https://prayer.example.com
    depends_on: [db]
    ports: ["8000:8000"]
volumes:
  pgdata:
